version: '3.8'

services:
  engine:
    build: ./engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  orchestrator:
    build: ./orchestrator
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - ENGINE_URL=http://engine:8000
      - CLIENT_ORIGIN=*
    depends_on:
      engine:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - orchestrator
